<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pokémon Card Search</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="app">
    <h1>Pokémon Card Search</h1>

    <!-- Search form -->
    <form id="search-form" class="search-form">
      <input
        type="text"
        id="search-input"
        placeholder="Enter a Pokémon name (e.g. pikachu)"
        autocomplete="off"
      >
      <button type="submit">Search</button>
    </form>

    <!-- Quick-search buttons -->
    <div class="quick-search">
      <button type="button" class="quick-btn" data-name="pikachu">Pikachu</button>
      <button type="button" class="quick-btn" data-name="charizard">Charizard</button>
      <button type="button" class="quick-btn" data-name="bulbasaur">Bulbasaur</button>
    </div>

    <!-- Where all results/messages get rendered -->
    <div id="result-area" class="result-area">
      <p class="placeholder">Search a Pokémon to see its card.</p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
